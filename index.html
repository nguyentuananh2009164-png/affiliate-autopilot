
<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Affiliate AutoPilot</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
  <header>
    <div>
      <h1>Affiliate AutoPilot</h1>
      <p>Hệ thống quản lý tiếp thị liên kết</p>
    </div>
    <button id="logoutBtn" class="secondary hidden" type="button">Đăng xuất</button>
  </header>

  <main>
    <div id="configNotice" class="notice hidden">
      Chưa cấu hình Supabase. Kiểm tra app.js.
    </div>

    <section id="authPanel" class="panel">
      <h2>Đăng nhập / Đăng ký</h2>

      <label>Email
        <input id="email" type="email" placeholder="Email">
      </label>

      <label>Mật khẩu
        <input id="password" type="password" placeholder="Mật khẩu">
      </label>

      <div class="actions">
        <button id="loginBtn" type="button">Đăng nhập</button>
        <button id="signupBtn" class="secondary" type="button">Đăng ký</button>
      </div>

      <p id="authMessage" class="message"></p>
    </section>

    <section id="appPanel" class="hidden">
      <div class="stats">
        <div class="stat">
          <span>Tổng sản phẩm</span>
          <strong id="totalCount">0</strong>
        </div>
        <div class="stat">
          <span>Đang quảng bá</span>
          <strong id="activeCount">0</strong>
        </div>
        <div class="stat">
          <span>Hoa hồng dự kiến</span>
          <strong id="commissionTotal">0₫</strong>
        </div>
      </div>

      <section class="panel">
        <h2 id="formTitle">Thêm sản phẩm</h2>

        <form id="productForm">
          <input id="productId" type="hidden">

          <label>Tên sản phẩm
            <input id="name" required>
          </label>

          <label>Link sản phẩm
            <input id="productUrl" type="url">
          </label>

          <label>Link Affiliate
            <input id="affiliateUrl" type="url">
          </label>

          <div class="two">
            <label>Giá
              <input id="price" type="number" min="0" value="0">
            </label>
            <label>Hoa hồng dự kiến
              <input id="commission" type="number" min="0" value="0">
            </label>
          </div>

          <div class="two">
            <label>Đánh giá
              <input id="rating" type="number" min="0" max="5" step="0.1" value="0">
            </label>
            <label>Lượt đánh giá
              <input id="reviewCount" type="number" min="0" value="0">
            </label>
          </div>

          <label>Danh mục
            <input id="category">
          </label>

          <label>Trạng thái
            <select id="status">
              <option value="candidate">Đang cân nhắc</option>
              <option value="active">Đang quảng bá</option>
              <option value="paused">Tạm dừng</option>
            </select>
          </label>

          <label>Ghi chú
            <textarea id="notes" rows="3"></textarea>
          </label>

          <div class="actions">
            <button type="submit">Lưu sản phẩm</button>
            <button id="resetBtn" class="secondary" type="button">Làm mới</button>
          </div>

          <p id="formMessage" class="message"></p>
        </form>
      </section>

      <section class="panel">
        <div class="listHead">
          <h2>Danh sách sản phẩm</h2>
          <input id="search" type="search" placeholder="Tìm sản phẩm">
        </div>
        <div id="productList">Đang tải...</div>
      </section>
    </section>
  </main>

  <footer>Affiliate AutoPilot</footer>
  <script src="app.js"></script>
</body>
</html>
